invariants:
  - Each canonical offering has exactly one company, canonical name, kind, and active status in this controlled corpus.
  - Each primary observation is a first-party source record from source-manifest.yml.
  - Corroborating source records enrich provenance and must not produce duplicate canonical offerings.
  - No record means an offering changed, was discontinued, or has a commercial implication beyond the explicit observed fact.
  - Entity resolution must preserve existing unknown-company review behavior and must not create canonical Companies from this file.
  - Any future ingestion must use Ticket 07A offering proposal, audit, approval, and apply controls.
