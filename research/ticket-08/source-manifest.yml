manifest_version: 1
status: ready_for_human_review
purpose: >-
  A controlled, primary-source research corpus for Ticket 08B. It supports human
  review and future test-fixture preparation only; it is not a production data store
  and does not authorize ingestion, schema changes, public-read changes, or UI changes.
created_at: 2026-08-18
retrieved_at: 2026-08-18

collection_policy:
  source_priority:
    - official_company_website
    - official_product_page
    - official_service_page
    - official_documentation
    - official_press_release
    - official_company_announcement
    - government_procurement_record
    - official_job_posting
  permitted_source_types:
    - official_product_page
    - official_service_page
    - official_company_page
    - official_documentation
    - official_press_release
    - government_record
    - other_primary_source
  permitted_supports:
    - company_identity
    - product_observed
    - service_observed
    - offering_changed
    - offering_discontinued
    - hiring_signal
    - contract_signal
  prohibited:
    - login_gated_or_private_source
    - personal_contact_information
    - raw_source_text
    - inferred_offering_claim
    - inferred_discontinuation_claim
    - secondary_source_as_primary_evidence
  review_rules:
    - Record only a specific claim explicitly supported by the linked primary source.
    - Use observed_date for a source publication or page date when available; otherwise retain null and use retrieved_at as capture metadata only.
    - A missing or changed page is not evidence of offering_discontinued.
    - offering_discontinued requires affirmative primary-source evidence and separate reviewer approval before any future ingestion.
    - Secondary sources may identify candidates but must be recorded only in discovery notes, never as primary evidence.
    - Do not include production UUIDs, raw page text, personal data, credentials, or scraped HTML.

