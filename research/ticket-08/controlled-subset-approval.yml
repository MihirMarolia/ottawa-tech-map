approval_rules:
  - A source must explicitly support the named candidate before it can be approved as a canonical offering observation.
  - Corroborating sources must link to the same canonical offering rather than create duplicates.
  - Each approved canonical offering must have exactly one kind in this corpus.
  - An observation must not be represented as an inference or interpretation.
  - The absence of a source mention must not imply discontinuation.
  - The corpus remains a Git-reviewed research artifact; Supabase is the sole durable source of truth for operational data.
